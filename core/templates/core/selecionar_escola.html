{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Selecionar Escola</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="300x300" href="{% static 'imgs/apple-touch-icon.png' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'imgs/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'imgs/favicon-16x16.png' %}">
  <link rel="manifest" href="{% static 'imgs/site.webmanifest' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    :root {
        --primary-color: #4361ee;
        --primary-dark: #3a56d4;
        --secondary-color: #7209b7;
        --success-color: #06ffa5;
        --danger-color: #f72585;
        --warning-color: #f8961e;
        --info-color: #4cc9f0;
        --light-bg: #f8f9fa;
        --dark-text: #2b2d42;
        --gray-text: #6c757d;
        --border-radius: 16px;
        --border-radius-sm: 12px;
        --box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        --box-shadow-hover: 0 15px 50px rgba(0, 0, 0, 0.12);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
        background: linear-gradient(135deg, #dbdde6 0%, #929094 100%);
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    .selection-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
    }

    .school-card {
        background: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        overflow: hidden;
        transition: var(--transition);
        border: none;
    }

    .school-card:hover {
        box-shadow: var(--box-shadow-hover);
        transform: translateY(-5px);
    }

    .card-header-custom {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        padding: 2rem;
        text-align: center;
        border-bottom: none;
    }

    .card-header-custom h4 {
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .card-header-custom p {
        margin: 0.5rem 0 0 0;
        opacity: 0.95;
        font-size: 0.9rem;
    }

    .alert-custom {
        background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
        border: none;
        border-radius: var(--border-radius-sm);
        padding: 1.25rem;
        margin-bottom: 1.5rem;
    }

    .user-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: rgba(67, 97, 238, 0.1);
        border-radius: 50px;
        font-size: 0.9rem;
        margin-top: 0.5rem;
    }

    .user-badge i {
        color: var(--primary-color);
    }

    .school-list-item {
        border: 2px solid #e9ecef;
        border-radius: var(--border-radius-sm);
        margin-bottom: 1rem;
        transition: var(--transition);
        background: white;
        overflow: hidden;
    }

    .school-list-item:hover {
        border-color: var(--primary-color);
        transform: translateX(8px);
        box-shadow: 0 5px 20px rgba(67, 97, 238, 0.15);
    }

    .school-button {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
    }

    .school-content {
        padding: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
    }

    .school-logo {
        flex-shrink: 0;
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .school-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .school-logo-placeholder {
        font-size: 2rem;
        font-weight: bold;
        color: white;
    }

    .school-info {
        flex: 1;
    }

    .school-name {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--dark-text);
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
    }

    .school-details {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        font-size: 0.85rem;
        color: var(--gray-text);
    }

    .school-details i {
        margin-right: 0.25rem;
        color: var(--primary-color);
    }

    .school-arrow {
        flex-shrink: 0;
        color: var(--primary-color);
        font-size: 1.25rem;
        transition: var(--transition);
    }

    .school-list-item:hover .school-arrow {
        transform: translateX(5px);
    }

    .btn-voltar {
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        border: 2px solid #dee2e6;
        color: var(--dark-text);
        padding: 0.75rem 1.5rem;
        border-radius: 50px;
        font-weight: 600;
        transition: var(--transition);
    }

    .btn-voltar:hover {
        background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
        border-color: var(--danger-color);
        color: var(--danger-color);
        transform: translateY(-2px);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animated-card {
        animation: fadeInUp 0.6s ease-out;
    }

    @media (max-width: 768px) {
        .school-content {
            flex-direction: column;
            text-align: center;
            padding: 1.25rem;
        }
        
        .school-details {
            justify-content: center;
        }
        
        .school-logo {
            width: 60px;
            height: 60px;
        }
        
        .school-name {
            justify-content: center;
        }
        
        .card-header-custom {
            padding: 1.5rem;
        }
        
        .user-badge {
            font-size: 0.8rem;
        }
    }
</style>
<div class="selection-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="school-card animated-card">
                    <div class="card-header-custom">
                        <h4 class="text-white mb-2">
                            <i class="fas fa-school me-2"></i>
                            Olá, {{ user_nome }}! Selecionar Escola
                        </h4>
                        <p class="text-white-50">
                            Escolha qual unidade educacional deseja acessar
                        </p>
                    </div>
                        
                        <form method="post" action="{% url 'core:selecionar_escola' %}">
                            {% csrf_token %}
                            <div class="schools-list">
                                {% for escola in escolas %}
                                <div class="school-list-item">
                                    <button type="submit" name="escola_id" value="{{ escola.id }}" class="school-button">
                                        <div class="school-content">
                                            <div class="school-logo">
                                                {% if escola.logotipo %}
                                                    <img src="{{ escola.logotipo.url }}" alt="{{ escola.nome }}">
                                                {% else %}
                                                    <div class="school-logo-placeholder">
                                                        {{ escola.nome|make_list|first|upper }}
                                                    </div>
                                                {% endif %}
                                            </div>
                                            <div class="school-info">
                                                <div class="school-name">
                                                    {{ escola.nome }}
                                                    {% if escola.decreto_executivo %}
                                                        <span class="badge bg-info bg-opacity-10 text-info">
                                                            <i class="fas fa-certificate"></i> 
                                                            Dec. Executivo
                                                        </span>
                                                    {% endif %}
                                                </div>
                                                <div class="school-details">
                                                    <span>
                                                        <i class="fas fa-map-marker-alt"></i> 
                                                        {{ escola.municipio }}, {{ escola.provincia }}
                                                    </span>
                                                    {% if escola.contacto %}
                                                    <span>
                                                        <i class="fas fa-phone-alt"></i> 
                                                        {{ escola.contacto }}
                                                    </span>
                                                    {% endif %}
                                                    {% if escola.nif %}
                                                    <span>
                                                        <i class="fas fa-id-card"></i> 
                                                        NIF: {{ escola.nif }}
                                                    </span>
                                                    {% endif %}
                                                    {% if escola.endereco %}
                                                    <span>
                                                        <i class="fas fa-location-dot"></i> 
                                                        {{ escola.endereco|truncatechars:30 }}
                                                    </span>
                                                    {% endif %}
                                                </div>
                                            </div>
                                            <div class="school-arrow">
                                                <i class="fas fa-chevron-right"></i>
                                            </div>
                                        </div>
                                    </button>
                                </div>
                                {% empty %}
                                <div class="alert alert-warning text-center">
                                    <i class="fas fa-exclamation-triangle me-2"></i>
                                    Nenhuma escola encontrada para este usuário.
                                </div>
                                {% endfor %}
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <div class="text-center">
                            <a href="{% url 'core:logout' %}" class="btn-voltar">
                                <i class="fas fa-sign-out-alt me-2"></i>
                                Sair da Conta
                            </a>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <i class="fas fa-shield-alt me-1"></i>
                                Ambiente seguro - Sistema de Gestão Escolar
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    // Adicionar classe active para animação ao carregar
    document.addEventListener('DOMContentLoaded', function() {
        const schoolItems = document.querySelectorAll('.school-list-item');
        schoolItems.forEach((item, index) => {
            item.style.animation = `fadeInUp 0.5s ease-out ${index * 0.1}s forwards`;
            item.style.opacity = '0';
        });
        
        // Adicionar efeito ripple aos botões
        const buttons = document.querySelectorAll('.school-button');
        buttons.forEach(button => {
            button.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    });
    
    // Adicionar estilos para o efeito ripple
    const style = document.createElement('style');
    style.textContent = `
        .school-button {
            position: relative;
            overflow: hidden;
        }
        
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(67, 97, 238, 0.3);
            width: 100px;
            height: 100px;
            margin-top: -50px;
            margin-left: -50px;
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }
        
        @keyframes ripple-animation {
            from {
                transform: scale(0);
                opacity: 1;
            }
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .school-list-item {
            opacity: 0;
        }
    `;
    document.head.appendChild(style);
</script>
</html>
