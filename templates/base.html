<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}SIGEsc{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 250px;
      background-color: #0d6efd;
      color: white;
      position: fixed;
      height: 100%;
      padding-top: 60px;
    }
    .sidebar a {
      color: white;
      padding: 15px;
      display: block;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #0b5ed7;
    }
    .content {
      margin-left: 250px;
      padding: 20px;
      flex-grow: 1;
      background-color: #f8f9fa;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4 class="text-center">SIGEsc</h4>
    <a href="{% url 'dashboard' %}">📊 Dashboard</a>
    <a href="#">🎓 Alunos</a>
    <a href="#">📚 Professores</a>
    <a href="#">📝 Matrículas</a>
    <a href="#">💰 Financeiro</a>
    <a href="#">📄 Documentos</a>
    <a href="{% url 'logout' %}">🚪 Sair</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    {% block content %}
    <h1>Bem-vindo ao SIGEsc</h1>
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
