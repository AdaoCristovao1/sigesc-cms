{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Tipo</title>
    
    <!-- CSS -->
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="300x300" href="{% static 'imgs/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'imgs/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'imgs/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'imgs/site.webmanifest' %}">
    
    <style>
        @media print {
            .page-break { 
                page-break-before: always; 
            }
            
            thead.bg-primary {
                background-color: #0d6efd !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            thead.bg-primary th {
                color: white !important;
            }
            
            .no-print {
                display: none !important;
            }
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin: 2cm;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header img.logo {
            display: block;
            margin: 0 auto;
            width: 80px;
            height: auto;
        }

        .header h1, 
        .header h2, 
        .header h3 {
            margin: 0;
            padding: 3px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, 
        th, 
        td {
            border: 1px solid black;
        }

        th, 
        td {
            padding: 5px;
            text-align: center;
        }

        .assinatura {
            margin-top: 50px;
            text-align: right;
        }

        .turma-title {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Seção de Seleção de Classe (visível apenas na tela) -->
    <div class="no-print mb-3">
        <h4>Selecionar Classe para a Declaração de <b class="text-primary">{{ aluno.nome_completo }}</b></h4>
        <hr>
        <ul class="list-group">
            {% for c in classes %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ c.numero }}ª Classe
                    <a class="btn btn-primary btn-sm"
                            href="{% url 'documentos:gerar_declaracao_com_notas' aluno.id c.id finalidade %}">
                        Gerar Declaração
                </a>
                </li>
            {% endfor %}
        </ul>
    </div>

    <!-- Modal para Dados da Declaração -->
    <div class="modal fade" id="modalCertificado" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <form method="post" id="formDeclaracao" target="_blank">
                    {% csrf_token %}
                    
                    <!-- Cabeçalho do Modal -->
                    <div class="modal-header">
                        <h5 class="modal-title">Dados para Emissão da Declaração</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    
                    <!-- Corpo do Modal -->
                    <div class="modal-body">
                        <div class="row g-3">
                            <!-- Dados do Aluno -->
                            <div class="col-md-6">
                                <label>Nome do Pai</label>
                                <input type="text" name="nome_pai" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label>Nome da Mãe</label>
                                <input type="text" name="nome_mae" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label>Naturalidade</label>
                                <input type="text" name="naturalidade" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label>Município</label>
                                <input type="text" name="municipio" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label>Província</label>
                                <input type="text" name="provincia" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label>Data de Nascimento</label>
                                <input type="date" name="data_nascimento" class="form-control" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label>Nº do B.I</label>
                                <input type="text" name="bi" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Rodapé do Modal -->
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">
                            Gerar Declaração
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script>
        // Configuração do Modal
        const modalCertificado = document.getElementById('modalCertificado');
        const formDeclaracao = document.getElementById('formDeclaracao');

        // Evento para capturar a URL do botão clicado
        modalCertificado.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const url = button.getAttribute('data-url');
            formDeclaracao.action = url;
        });
    </script>
</body>
</html>
