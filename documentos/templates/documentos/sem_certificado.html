{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Certificado não disponível</title>
    <link href="{% static 'bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="300x300" href="{% static 'imgs/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'imgs/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'imgs/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'imgs/site.webmanifest' %}">

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }
        .icon-alerta {
      font-size: 4rem;
      color: #dad60a;
    }
        .btn-voltar {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <i class="bi bi-exclamation-triangle-fill icon-alerta"></i>
    <h2 class="mt-3 text-danger">Certificado não disponível</h2>
    <p class="lead mt-3">{{ mensagem }}</p>
    
    <a href="{% url 'administracao:alunos_lista' %}" class="btn btn-primary btn-voltar">Voltar</a>
</div>

</body>
</html>
